name: Release

# A new tag named release/v<major>.<minor>.<patch> builds that commit and puts the zip on its
# release. Make the tag either on GitHub's release page (the zip is added to that release) or
# with git (git tag release/v1.0.0 && git push origin release/v1.0.0: a release is made).
on:
  push:
    tags: [ "release/v[0-9]+.[0-9]+.[0-9]+" ]

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Outside the checkout, or Godot would import itself as part of the project.
    - name: Install Godot and its export templates
      run: |
        $downloads = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable"
        $godot = "Godot_v$env:GODOT_VERSION-stable_mono_win64"
        Invoke-WebRequest "$downloads/$godot.zip" -OutFile "$env:RUNNER_TEMP\godot.zip"
        Invoke-WebRequest "$downloads/Godot_v$env:GODOT_VERSION-stable_mono_export_templates.tpz" -OutFile "$env:RUNNER_TEMP\templates.zip"
        Expand-Archive "$env:RUNNER_TEMP\godot.zip" $env:RUNNER_TEMP
        Expand-Archive "$env:RUNNER_TEMP\templates.zip" $env:RUNNER_TEMP
        $templates = New-Item "$env:APPDATA\Godot\export_templates" -ItemType Directory -Force
        Move-Item "$env:RUNNER_TEMP\templates" "$templates\$env:GODOT_VERSION.stable.mono"
        "GODOT=$env:RUNNER_TEMP\$godot\${godot}_console.exe" >> $env:GITHUB_ENV

    # WinGlue.cs is an autoload: Godot can't open the project until the C# is built.
    - name: Build the C#
      run: dotnet build smollSinner.sln

    - name: Import the project
      run: |
        & $env:GODOT --headless --path . --import

    - name: Export for Windows
      run: |
        New-Item build\SmollSinners -ItemType Directory
        & $env:GODOT --headless --path . --export-release "Windows Desktop" build\SmollSinners\smollSinner.exe

    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $version = $env:GITHUB_REF_NAME -replace '^release/'
        $zip = "SmollSinners-$version-windows.zip"
        Compress-Archive build\SmollSinners $zip
        gh release view $env:GITHUB_REF_NAME *> $null
        if ($LASTEXITCODE -eq 0) {
          gh release upload $env:GITHUB_REF_NAME $zip --clobber
        } else {
          gh release create $env:GITHUB_REF_NAME $zip --title "Smoll Sinners $version" --generate-notes
        }
